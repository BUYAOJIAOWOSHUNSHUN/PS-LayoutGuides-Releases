<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
  <title>品牌版式标准规范PS插件</title>
</head>
<body>
  <div class="panel">
    <header class="toolbar">
      <!-- 状态条和标题同一行，右对齐（老大要求）：既省一行高度，操作反馈又一眼能看到。 -->
      <div class="heading-row">
        <div class="heading">品牌版式标准规范</div>
        <div id="status" role="status" aria-live="polite">正在启动插件…</div>
      </div>
      <div class="brand-block">
        <div id="brandRow" class="brand-row" aria-label="品牌标准"></div>
      </div>
      <div class="tabs" role="tablist">
        <div id="tabScreen" class="tab active" role="tab" tabindex="0" aria-selected="true">电子显示设备标准 <span class="tab-tag">RGB</span></div>
        <div id="tabPrint" class="tab" role="tab" tabindex="0" aria-selected="false">印刷制作品标准 <span class="tab-tag">CMYK</span></div>
      </div>
    </header>

    <div class="scroll-content">
      <div class="document-card">
        <div class="document-info">
          <div id="documentName" class="document-name">请打开 Photoshop 文档</div>
          <div id="dimensions" class="muted">以整个文档画布为基准</div>
        </div>
        <!-- 颜色模式显示 + 切换：高亮的是文档当前模式，点另一个直接转换文档模式。 -->
        <div class="mode-switch" aria-label="文档颜色模式">
          <div id="modeRGB" class="mode-option" role="button" tabindex="0">RGB</div>
          <div id="modeCMYK" class="mode-option" role="button" tabindex="0">CMYK</div>
        </div>
      </div>

      <section id="pageScreen" class="page">
        <!-- 图片大小 / 画布大小：照 PS 官方对话框的排版 —— **标签在输入框上方**，
             单位是输入框右侧的下拉（sp-picker：像素/英寸/厘米/毫米/点/派卡）。
             一张卡一个单位下拉，控制宽度/高度两行（分辨率固定 PPI）。
             锁链挪到标题行右端（窄卡放不下 PS 那种两行之间的链条位）；
             画布卡的 9 格锚点也在标题行右端。两张卡仍左右并排。 -->
        <div class="size-columns">
          <!-- 图片大小：模仿 PS「图像大小」对话框 -->
          <div class="parameter-card size-card">
            <div class="size-card-title-row">
              <span class="size-card-title">图片大小</span>
              <span id="imageLock" class="size-lock locked" role="button" tabindex="0" aria-pressed="true" aria-label="锁定宽高比" title="锁定宽高比（点一下可解锁）">
                <img class="icon-chain" src="assets/icon-chain.png" alt="锁链">
              </span>
            </div>
            <div class="size-field">
              <span class="size-field-label">宽度</span>
              <div class="size-input-row">
                <sp-textfield id="imageWidth" class="size-input" aria-label="图片宽度"></sp-textfield>
                <!-- 单位下拉是自绘的（div + JS 菜单）：sp-picker 真机事件不可控（菜单能弹但选项选不上），自绘行为完全可控。 -->
                <div id="imageUnitPicker" class="unit-picker" role="button" tabindex="0" aria-label="图片大小单位" data-value="px"></div>
              </div>
            </div>
            <div class="size-field">
              <span class="size-field-label">高度</span>
              <div class="size-input-row">
                <sp-textfield id="imageHeight" class="size-input" aria-label="图片高度"></sp-textfield>
                <span class="size-unit-static" id="imageUnitText">像素</span>
              </div>
            </div>
            <div class="size-field">
              <span class="size-field-label">分辨率</span>
              <div class="size-input-row">
                <sp-textfield id="imageResolution" class="size-input" aria-label="图片分辨率"></sp-textfield>
                <span class="size-unit-static" title="像素/英寸">PPI</span>
              </div>
            </div>
            <div class="size-apply-row">
              <sp-button id="restoreImageSize" variant="secondary" class="quiet-button" title="放弃当前输入，恢复为文档的实际数值"><span class="button-label">还原</span></sp-button>
              <sp-button id="applyImageSize" variant="cta" class="compact-button" disabled><span class="button-label">确认修改</span></sp-button>
            </div>
          </div>

          <!-- 画布大小：模仿 PS「画布大小」对话框，锚点在标题行右侧 -->
          <div class="parameter-card size-card">
            <div class="size-card-title-row">
              <span class="size-card-title">画布大小</span>
              <div id="anchorGrid" class="anchor-grid" role="radiogroup" aria-label="锚点位置"></div>
            </div>
            <div class="size-field">
              <span class="size-field-label">宽度</span>
              <div class="size-input-row">
                <sp-textfield id="canvasWidth" class="size-input" aria-label="画布宽度"></sp-textfield>
                <div id="canvasUnitPicker" class="unit-picker" role="button" tabindex="0" aria-label="画布大小单位" data-value="cm"></div>
              </div>
            </div>
            <div class="size-field">
              <span class="size-field-label">高度</span>
              <div class="size-input-row">
                <sp-textfield id="canvasHeight" class="size-input" aria-label="画布高度"></sp-textfield>
                <span class="size-unit-static" id="canvasUnitText">厘米</span>
              </div>
            </div>
            <div class="size-field">
              <span class="size-field-label">画布扩展颜色</span>
              <!-- 自绘下拉（和单位下拉同一套代码）：前景 / 背景 / 白色 / 黑色 / 灰色。
                   PS 对话框里还有「其它…」会打开 PS 取色器 —— UXP 没有取色器接口，做不了。 -->
              <div class="size-input-row">
                <div id="canvasExtPicker" class="unit-picker" role="button" tabindex="0" aria-label="画布扩展颜色" data-value="white"></div>
                <!-- 色块外面包一层定位容器：取色器小面板（v1.9.13）以它为锚点 absolute 定位。 -->
                <span id="canvasExtSwatchWrap" class="ext-swatch-wrap">
                  <span id="canvasExtSwatch" class="ext-swatch" title="点这里选画布扩展颜色（预设色板 / 十六进制）"></span>
                </span>
              </div>
            </div>
            <div class="size-apply-row">
              <sp-button id="restoreCanvasSize" variant="secondary" class="quiet-button" title="放弃当前输入，恢复为文档的实际数值"><span class="button-label">还原</span></sp-button>
              <sp-button id="applyCanvasSize" variant="cta" class="compact-button" disabled><span class="button-label">确认修改</span></sp-button>
            </div>
          </div>
        </div>
      </section>

      <section id="pagePrint" class="page hidden">
        <div class="section-heading">
          <span class="section-title">出血设置</span>
          <!-- 锁定按钮放在单位切换（mm/cm）前面，尺寸与旁边按钮一致（老大要求）。
               默认锁定：改任意一边，其余三边同步。 -->
          <div class="heading-controls">
            <div id="lock" class="lock-button unlocked" role="button" tabindex="0" aria-label="锁定四边同步" aria-pressed="false">
              <img id="lockIcon" class="icon-lock" src="assets/icon-unlock.png" alt="">
            </div>
            <div class="unit-switch" aria-label="出血单位">
              <div id="unitMM" class="unit-option active" role="button" tabindex="0">mm</div>
              <div id="unitCM" class="unit-option" role="button" tabindex="0">cm</div>
            </div>
          </div>
        </div>
        <div class="parameter-card bleed-card">
          <!-- 锁定按钮放在十字正中（左/右之间）：位置即含义 —— 锁住时四边联动。
               数值框是自绘的（span + 键盘事件），不是 sp-textfield：
               UXP 的 sp-textfield 内部底色写死、CSS 和 quiet 变体都盖不掉，
               真机上就是一块黑。自绘之后底色完全由 styles.css 说了算。
               十字排布：上在上、下在下、左/右分居中间行两侧，锁在正中。
               行结构是普通横向 flex，不能用 CSS Grid（UXP 真机不支持）。 -->
          <div class="bleed-grid">
            <div class="bleed-cross-row bleed-cross-center">
              <div class="bleed-cell">
                <span class="bleed-label">上</span>
                <div class="bleed-input">
                  <sp-textfield id="bleed-top" class="bleed-field" aria-label="上出血"></sp-textfield><div class="stepper"><div id="step-up-top" class="step-up" role="button" tabindex="0" aria-label="上出血增加 1"><img class="chevron" src="assets/chevron-up.png" alt=""></div><div id="step-down-top" class="step-down" role="button" tabindex="0" aria-label="上出血减少 1"><img class="chevron" src="assets/chevron-down.png" alt=""></div></div><span class="bleed-unit" id="unit-top">mm</span>
                </div>
              </div>
            </div>
            <div class="bleed-cross-row bleed-cross-mid">
              <div class="bleed-cell">
                <span class="bleed-label">左</span>
                <div class="bleed-input">
                  <sp-textfield id="bleed-left" class="bleed-field" aria-label="左出血"></sp-textfield><div class="stepper"><div id="step-up-left" class="step-up" role="button" tabindex="0" aria-label="左出血增加 1"><img class="chevron" src="assets/chevron-up.png" alt=""></div><div id="step-down-left" class="step-down" role="button" tabindex="0" aria-label="左出血减少 1"><img class="chevron" src="assets/chevron-down.png" alt=""></div></div><span class="bleed-unit" id="unit-left">mm</span>
                </div>
              </div>
              <div class="bleed-cell">
                <span class="bleed-label">右</span>
                <div class="bleed-input">
                  <sp-textfield id="bleed-right" class="bleed-field" aria-label="右出血"></sp-textfield><div class="stepper"><div id="step-up-right" class="step-up" role="button" tabindex="0" aria-label="右出血增加 1"><img class="chevron" src="assets/chevron-up.png" alt=""></div><div id="step-down-right" class="step-down" role="button" tabindex="0" aria-label="右出血减少 1"><img class="chevron" src="assets/chevron-down.png" alt=""></div></div><span class="bleed-unit" id="unit-right">mm</span>
                </div>
              </div>
            </div>
            <div class="bleed-cross-row bleed-cross-center">
              <div class="bleed-cell">
                <span class="bleed-label">下</span>
                <div class="bleed-input">
                  <sp-textfield id="bleed-bottom" class="bleed-field" aria-label="下出血"></sp-textfield><div class="stepper"><div id="step-up-bottom" class="step-up" role="button" tabindex="0" aria-label="下出血增加 1"><img class="chevron" src="assets/chevron-up.png" alt=""></div><div id="step-down-bottom" class="step-down" role="button" tabindex="0" aria-label="下出血减少 1"><img class="chevron" src="assets/chevron-down.png" alt=""></div></div><span class="bleed-unit" id="unit-bottom">mm</span>
                </div>
              </div>
            </div>
          </div>
          <!-- 状态和预览两行放左列；右侧「清零」弱化成灰字小按钮，「创建出血线」是主按钮放大突出。 -->
          <div class="bleed-create-row">
            <div class="bleed-create-info">
              <span id="bleedGuideState" class="muted">尚未创建</span>
              <div id="bleedPreview" class="muted">按文档分辨率换算</div>
            </div>
            <sp-button id="bleedReset" variant="secondary" class="quiet-button" aria-label="四个出血值全部清零"><span class="button-label">清零</span></sp-button>
            <sp-button id="bleed" variant="cta" class="compact-button wide-cta" disabled><span class="button-label">创建出血线</span></sp-button>
          </div>
        </div>
      </section>

      <!-- 共用一组按钮：两个页签的宽度、高度与间距始终一致。 -->
      <section class="guide-section">
        <div class="section-heading"><span class="section-title">生成辅助线</span></div>
        <div class="guide-actions">
          <sp-button id="update" variant="cta" class="guide-button" disabled><span class="button-label">版心线</span></sp-button>
          <sp-button id="logo" variant="cta" class="guide-button" disabled><span class="button-label">LOGO 高度线</span></sp-button>
          <sp-button id="endorsement" variant="cta" class="guide-button" disabled><span class="button-label">背书高度线</span></sp-button>
        </div>
      </section>

      <div class="bottom-actions">
        <sp-button id="clear" variant="secondary" class="utility-button" disabled aria-label="删除全部辅助线">
          <span class="button-inner">
            <img id="trashIcon" class="icon-trash" src="assets/icon-trash.png" alt="">
            <span class="button-label">删除辅助线</span>
          </span>
        </sp-button>
        <sp-button id="visibility" variant="secondary" class="utility-button" disabled>
          <span class="button-inner">
            <img id="eyeIcon" class="icon-eye" src="assets/icon-eye.png" alt="">
            <span id="visibilityLabel" class="button-label">隐藏辅助线</span>
          </span>
        </sp-button>
      </div>
    </div>

    <!-- 版本号已经跟在标题后面了，页脚只留更新入口和版权，尽量压薄。 -->
    <footer class="panel-footer">
      <div class="update-row">
        <!-- UXP 给 sp-button 内置 auto 外边距且压不过它的内部样式（margin:0 无效，真机实测）。
             包一层宽度由内容决定的 div，容器里没有自由空间，auto margin 自然归零 —— 结构级解决。 -->
        <div class="update-left">
          <sp-button id="checkUpdate" variant="secondary" class="update-button"><span class="button-label">检查更新</span></sp-button>
          <!-- 版本号跟着「检查更新」走：查更新时一眼能对上「本地是什么版本、远端是什么版本」。 -->
          <span id="footerVersion" class="footer-version">v1.9.13</span>
        </div>
        <!-- 更新状态（发现新版本 / 网络错误等）跟在版本号后面；版权名固定最右。
             space-between + 状态行 flex:1：状态显示时贴着版本号，收起时版权自然靠右。 -->
        <div id="updateStatus" class="muted hidden"></div>
        <span class="signature">©蛋生品牌设计</span>
      </div>
      <sp-button id="installUpdate" variant="cta" class="primary hidden">下载并安装更新</sp-button>
      <!-- 手动更新：链接样式的文字按钮（悬停下划线+高亮），点了打开 GitHub 发布页自行下载覆盖。 -->
      <div id="openRelease" class="release-link hidden" role="button" tabindex="0">手动更新</div>
    </footer>
  </div>
  <script src="bootstrap.js"></script>
</body>
</html>
